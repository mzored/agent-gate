name: test

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "lib/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    # The gate reads macOS sysctls and Mach host statistics; it has no Linux path.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m py_compile lib/*.py bin/agent-gate bin/agent-verify bin/gate-host
      - name: Shell syntax
        run: sh -n bin/devshim
      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -v
